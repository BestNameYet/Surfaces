name: Create root log JSON

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  create-log:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch centralized log initializer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run append-log.yml \
            --repo "$GH_REPO" \
            --ref main \
            --raw-field operation=initialize
          echo "Initialization dispatched; inspect the Append log entry workflow for completion."
