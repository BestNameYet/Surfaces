name: Create Inputs folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create root Inputs directory
        run: mkdir -p Inputs && touch Inputs/.gitkeep

      - name: Commit directory placeholder if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Inputs/.gitkeep
          if git diff --cached --quiet; then
            echo "Inputs already exists; no commit required."
          else
            git commit -m "Create Inputs directory"
            git push
          fi
