name: Append log entry

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'append or initialize'
        required: true
        default: append
        type: choice
        options:
          - append
          - initialize
      entry:
        description: 'JSON object with Source, Time, Input, Error (required for append)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: surfaces-log-json-writer
  cancel-in-progress: false

jobs:
  append-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Perform validated log operation
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          ENTRY_JSON: ${{ inputs.entry }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          operation = os.environ["OPERATION"]
          path = Path("log.json")
          if operation == "initialize":
              if path.exists():
                  entries = json.loads(path.read_text(encoding="utf-8"))
                  if not isinstance(entries, list):
                      raise ValueError("Existing log.json must be a JSON array")
                  print("log.json already exists; preserving contents.")
              else:
                  path.write_text("[]\n", encoding="utf-8")
                  print("Initialized log.json as an empty array.")
          elif operation == "append":
              entry = json.loads(os.environ["ENTRY_JSON"])
              required = {"Source", "Time", "Input", "Error"}
              if not isinstance(entry, dict) or set(entry) != required:
                  raise ValueError("Log entry must contain exactly Source, Time, Input, Error")
              if (not isinstance(entry["Source"], str)
                      or not isinstance(entry["Time"], int)
                      or isinstance(entry["Time"], bool)
                      or not isinstance(entry["Input"], str)
                      or not isinstance(entry["Error"], str)):
                  raise ValueError("Invalid log entry types")
              entries = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(entries, list):
                  raise ValueError("log.json must be an array")
              entries.append(entry)
              path.write_text(json.dumps(entries, ensure_ascii=False, indent=2) + "\n",
                              encoding="utf-8")
              print(f"Appending error entry for source {entry['Source']}")
          else:
              raise ValueError(f"Unsupported log operation: {operation}")

          PY

      - name: Commit log.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- log.json
          if git diff --cached --quiet; then
            echo "No changes to log.json."
            exit 0
          fi
          git commit -m "Apply dispatched log operation"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent repository update; retrying ($attempt/5)."
            sleep "$attempt"
          done
          echo "Failed to publish log after five attempts." >&2
          exit 1
