name: Append log entry

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'append or initialize'
        required: true
        default: append
        type: choice
        options:
          - append
          - initialize
      entry:
        description: 'JSON object with Source, Time, Input, Error (required for append)'
        required: false
        type: string

permissions:
  contents: write

# Serialize log mutations. GitHub queues up to 100 pending runs.
concurrency:
  group: surfaces-log-json-writer
  cancel-in-progress: false
  queue: max

jobs:
  append-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate log request and apply transaction with retry
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          ENTRY_JSON: ${{ inputs.entry }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Validate once, before retries. Time and Source form the dedupe key.
          python3 - <<'PY'
          import json
          import os

          operation = os.environ["OPERATION"]
          if operation not in ("append", "initialize"):
              raise ValueError("Unsupported log operation: " + operation)
          if operation == "append":
              entry = json.loads(os.environ["ENTRY_JSON"])
              required = {"Source", "Time", "Input", "Error"}
              if not isinstance(entry, dict) or set(entry) != required:
                  raise ValueError("Log entry must contain exactly Source, Time, Input, Error")
              if (not isinstance(entry["Source"], str)
                      or not isinstance(entry["Time"], int)
                      or isinstance(entry["Time"], bool)
                      or not isinstance(entry["Input"], str)
                      or not isinstance(entry["Error"], str)):
                  raise ValueError("Invalid log entry types")
          PY

          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt: reading latest main and checking duplicate key"
            git fetch origin main
            git reset --hard origin/main

            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          operation = os.environ["OPERATION"]
          path = Path("log.json")
          if path.exists():
              entries = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(entries, list):
                  raise ValueError("log.json must contain a JSON array")
          else:
              if operation != "initialize":
                  raise FileNotFoundError("log.json is absent; initialize it first")
              entries = []

          if operation == "initialize":
              if path.exists():
                  print("log.json exists; initialization is a no-op.")
              else:
                  path.write_text("[]\n", encoding="utf-8")
                  print("Initialized log.json as an empty array.")
          else:
              entry = json.loads(os.environ["ENTRY_JSON"])
              key = (entry["Time"], entry["Source"])
              if any(isinstance(item, dict)
                     and item.get("Time") == key[0]
                     and item.get("Source") == key[1]
                     for item in entries):
                  print(f"DUPLICATE: Source={key[1]} Time={key[0]}; skipping append.")
              else:
                  entries.append(entry)
                  path.write_text(json.dumps(entries, ensure_ascii=False, indent=2) + "\n",
                                  encoding="utf-8")
                  print(f"APPENDED: Source={key[1]} Time={key[0]}")
          PY

            git add -- log.json
            if git diff --cached --quiet; then
              echo "No new log mutation required; exiting successfully."
              exit 0
            fi
            git commit -m "Apply deduplicated log operation"
            if git push origin HEAD:main; then
              echo "log.json mutation committed."
              exit 0
            fi
            echo "Main advanced before push; recomputing append from latest log.json."
            sleep "$attempt"
          done

          echo "Failed to commit log mutation after five recomputed attempts." >&2
          exit 1
