name: Listen for Inputs commits

on:
  push:
    paths:
      - 'Inputs/**'

permissions:
  contents: read

jobs:
  inputs-commit-listener:
    runs-on: ubuntu-latest
    steps:
      - name: Report triggering commit
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Inputs change detected."
          echo "Event: $EVENT_NAME"
          echo "Ref: $REF_NAME"
          echo "Commit: $COMMIT_SHA"
