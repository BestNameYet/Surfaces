name: Listen for Inputs commits

on:
  push:
    paths:
      - 'Inputs/**'

permissions:
  contents: write

concurrency:
  group: inputs-listener-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inputs-commit-listener:
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate, execute, and log first error
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time

          SYMBOLS = ("$", "&", "@")
          SHAPE = '{"CL":"$","$":{"command":"","arguments":{},"flags":{}}}'
          root = Path("Inputs")
          log_path = Path("log.json")

          def git(*args, input=None):
              return subprocess.run(["git", *args], input=input, check=True,
                                    stdout=subprocess.PIPE, stderr=subprocess.PIPE).stdout

          def commit_if_changed():
              staged = subprocess.run(["git", "diff", "--cached", "--quiet"])
              if staged.returncode == 0:
                  return
              if staged.returncode != 1:
                  raise RuntimeError("Unable to inspect staged changes")
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email",
                              "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "commit", "-m", "Log first Inputs processing error"], check=True)
              subprocess.run(["git", "push", "origin",
                              "HEAD:refs/heads/" + os.environ["BRANCH_NAME"]], check=True)

          def error_and_halt(path, source, original, message, reset):
              item = {"Source": source, "Time": int(time.time()),
                      "Input": original, "Error": message}
              try:
                  log = json.loads(log_path.read_text(encoding="utf-8"))
                  if not isinstance(log, list):
                      raise ValueError("log.json must contain a JSON array")
              except FileNotFoundError:
                  log = []
              log.append(item)
              log_path.write_text(json.dumps(log, ensure_ascii=False, indent=2) + "\n",
                                  encoding="utf-8")
              subprocess.run(["git", "add", "--", "log.json"], check=True)
              if reset:
                  path.write_text("{}\n", encoding="utf-8")
                  subprocess.run(["git", "add", "--", str(path)], check=True)
              print("INPUT ERROR:", message, "source:", source, flush=True)
              commit_if_changed()
              sys.exit(1)

          before = os.environ["BEFORE_SHA"]
          after = os.environ["AFTER_SHA"]
          if before == "0" * 40:
              before = git("hash-object", "-t", "tree", "--stdin", input=b"").decode().strip()

          changed = git("diff", "--name-only", "-z", "--diff-filter=ACMR",
                        before, after, "--", "Inputs/").split(b"\0")

          for raw_path in changed:
              if not raw_path:
                  continue
              path = Path(os.fsdecode(raw_path))
              if (path.parent != root or not re.fullmatch(r"agentInput\d{3}\.json", path.name)
                      or not path.is_file() or path.is_symlink()):
                  continue
              source = path.stem[-3:]
              original = path.read_bytes().decode("utf-8", errors="replace")
              try:
                  data = json.loads(original)
              except json.JSONDecodeError as exc:
                  error_and_halt(path, source, original,
                      f"Invalid JSON: {exc.msg} (line {exc.lineno}, column {exc.colno}). "
                      f"Expected shape: {SHAPE}", True)

              if not isinstance(data, dict) or data.get("CL") not in SYMBOLS:
                  error_and_halt(path, source, original,
                      'Missing or invalid CL: expected top-level "CL" equal to "$", "&", or "@".',
                      True)

              symbol = data["CL"]
              if symbol not in data:
                  error_and_halt(path, source, original,
                      f'Missing Symbol: expected top-level "{symbol}" object. '
                      f"Expected shape: {SHAPE}", True)

              spec = data[symbol]
              if (not isinstance(spec, dict)
                      or set(spec) != {"command", "arguments", "flags"}
                      or not isinstance(spec.get("command"), str)
                      or not isinstance(spec.get("arguments"), dict)
                      or not isinstance(spec.get("flags"), dict)):
                  error_and_halt(path, source, original,
                      f"Invalid Symbol object for {symbol!r}. Required members and types: "
                      '"command": string, "arguments": object, "flags": object. '
                      f"Expected shape: {SHAPE}", True)

              # No CL-specific argument/flag mapping is defined in this repository.
              # Pass the objects to the shell in environment variables without guessing CLI syntax.
              env = os.environ.copy()
              env["CL"] = symbol
              env["CL_ARGUMENTS_JSON"] = json.dumps(spec["arguments"])
              env["CL_FLAGS_JSON"] = json.dumps(spec["flags"])
              if not spec["command"].strip():
                  error_and_halt(path, source, original,
                      "CL shell execution error: command is empty.", False)
              try:
                  result = subprocess.run(["bash", "-lc", spec["command"]],
                                          env=env, capture_output=True, text=True)
              except OSError as exc:
                  error_and_halt(path, source, original,
                      f"CL shell execution error: {exc}", False)
              if result.returncode != 0:
                  message = (result.stderr or result.stdout or
                             f"Command exited with status {result.returncode}").strip()
                  error_and_halt(path, source, original,
                      f"CL shell execution error (exit {result.returncode}): {message}", False)
              print(f"VALID AND EXECUTED: {path} (CL={symbol})")

          print("All changed agent input files processed without errors.")
          PY
