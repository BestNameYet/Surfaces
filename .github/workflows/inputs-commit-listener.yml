name: Listen for Inputs commits

on:
  push:
    paths:
      - 'Inputs/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: inputs-listener-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inputs-commit-listener:
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate, execute, and log first error
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import shlex
          import subprocess
          import sys
          import time

          SYMBOLS = ("$", "&", "@")
          SHAPE = '{"CL":"$","$":{"command":"","arguments":{},"flags":{}}}'
          root = Path("Inputs")

          def git(*args, input=None):
              return subprocess.run(["git", *args], input=input, check=True,
                                    stdout=subprocess.PIPE, stderr=subprocess.PIPE).stdout

          def commit_if_changed(message="Reset invalid Inputs surface"):
              staged = subprocess.run(["git", "diff", "--cached", "--quiet"])
              if staged.returncode == 0:
                  return
              if staged.returncode != 1:
                  raise RuntimeError("Unable to inspect staged changes")
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email",
                              "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "commit", "-m", message], check=True)
              subprocess.run(["git", "push", "origin",
                              "HEAD:refs/heads/" + os.environ["BRANCH_NAME"]], check=True)

          def error_and_halt(path, source, original, message, reset):
              item = {"Source": source, "Time": int(time.time()),
                      "Input": original, "Error": message}
              # Request the dedicated workflow to append the entry.
              # Dispatch acknowledgment is not a completion receipt.
              payload = json.dumps(item, ensure_ascii=False)
              subprocess.run([
                  "gh", "workflow", "run", "append-log.yml",
                  "--repo", os.environ["GH_REPO"],
                  "--ref", "main", "--raw-field", "operation=append",
                  "--raw-field", "entry=" + payload
              ], check=True)
              print("Dispatched log append; completion is asynchronous.", flush=True)
              if reset:
                  path.write_text("{}\n", encoding="utf-8")
                  subprocess.run(["git", "add", "--", str(path)], check=True)
              print("INPUT ERROR:", message, "source:", source, flush=True)
              commit_if_changed()
              sys.exit(1)

          before = os.environ["BEFORE_SHA"]
          after = os.environ["AFTER_SHA"]
          if before == "0" * 40:
              before = git("hash-object", "-t", "tree", "--stdin", input=b"").decode().strip()

          changed = git("diff", "--name-only", "-z", "--diff-filter=ACMR",
                        before, after, "--", "Inputs/").split(b"\0")

          for raw_path in changed:
              if not raw_path:
                  continue
              path = Path(os.fsdecode(raw_path))
              if (not path.is_relative_to(root) or path.name == ".gitkeep"
                      or not path.is_file() or path.is_symlink()):
                  continue
              match = re.fullmatch(r"agentInput(\d{3})\.json", path.name)
              source = match.group(1) if match else str(path.relative_to(root))
              original = path.read_bytes().decode("utf-8", errors="replace")
              try:
                  data = json.loads(original)
              except json.JSONDecodeError as exc:
                  error_and_halt(path, source, original,
                      f"Invalid JSON: {exc.msg} (line {exc.lineno}, column {exc.colno}). "
                      f"Expected shape: {SHAPE}", True)

              if not isinstance(data, dict) or data.get("CL") not in SYMBOLS:
                  error_and_halt(path, source, original,
                      'Missing or invalid CL: expected top-level "CL" equal to "$", "&", or "@".',
                      True)

              symbol = data["CL"]
              if symbol not in data:
                  error_and_halt(path, source, original,
                      f'Missing Symbol: expected top-level "{symbol}" object. '
                      f"Expected shape: {SHAPE}", True)

              spec = data[symbol]
              if (not isinstance(spec, dict)
                      or set(spec) != {"command", "arguments", "flags"}
                      or not isinstance(spec.get("command"), str)
                      or not isinstance(spec.get("arguments"), dict)
                      or not isinstance(spec.get("flags"), dict)):
                  error_and_halt(path, source, original,
                      f"Invalid Symbol object for {symbol!r}. Required members and types: "
                      '"command": string, "arguments": object, "flags": object. '
                      f"Expected shape: {SHAPE}", True)

              # Dispatch strictly by the validated CL selector.
              # Argument and flag objects remain environment-provided until a
              # CLI mapping contract is specified.
              env = os.environ.copy()
              env["CL"] = symbol
              env["CL_ARGUMENTS_JSON"] = json.dumps(spec["arguments"])
              env["CL_FLAGS_JSON"] = json.dumps(spec["flags"])

              if symbol == "@":
                  error_and_halt(path, source, original,
                      "Applications runner is not implemented (CL=@); no command executed.",
                      False)

              if not spec["command"].strip():
                  error_and_halt(path, source, original,
                      f"CL={symbol} execution error: command is empty.", False)

              if symbol == "$":
                  argv = ["bash", "-lc", spec["command"]]
                  engine = "Bash"
              elif symbol == "&":
                  try:
                      tokens = shlex.split(spec["command"])
                  except ValueError as exc:
                      error_and_halt(path, source, original,
                          f"GitHub CLI command parsing error: {exc}", False)
                  if tokens and tokens[0] == "gh":
                      tokens = tokens[1:]
                  if not tokens:
                      error_and_halt(path, source, original,
                          "GitHub CLI command is empty after removing optional gh prefix.",
                          False)
                  argv = ["gh", *tokens]
                  engine = "GitHub CLI"
              else:
                  raise AssertionError("Unexpected validated CL value")

              # A validated, executable input is consumed before the CL runs.
              # Preserve the parsed command and original input in memory for execution
              # and potential error logging, while clearing the repository surface.
              path.write_text("{}\n", encoding="utf-8")
              subprocess.run(["git", "add", "--", str(path)], check=True)
              commit_if_changed("Consume validated Inputs surface")
              print(f"INPUT CLEARED AND COMMITTED: {path}", flush=True)

              try:
                  result = subprocess.run(argv, env=env, capture_output=True, text=True)
              except OSError as exc:
                  error_and_halt(path, source, original,
                      f"{engine} execution error: {exc}", False)
              if result.returncode != 0:
                  message = (result.stderr or result.stdout or
                             f"Command exited with status {result.returncode}").strip()
                  error_and_halt(path, source, original,
                      f"{engine} execution error (exit {result.returncode}): {message}", False)
              print(f"VALID AND EXECUTED: {path} (CL={symbol}, engine={engine})")

          print("All changed agent input files processed without errors.")
          PY
