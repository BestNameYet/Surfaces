name: Delete all tracked files except this YAML file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Delete other tracked files and commit
        shell: bash
        run: |
          set -euo pipefail
          keep="delete-everything-except-self.yaml"
          git ls-files -z | while IFS= read -r -d '' file; do
            if [[ "$file" != "$keep" ]]; then
              git rm -- "$file"
            fi
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove all tracked files except cleanup YAML"
            git push
          fi
